services:
  # ※ 開発専用コンテナ。本番環境では RDS 等の外部DBを使用します。
  db:
    image: mysql:8.0.27
    env_file:
      - .env
    ports:
      - 3306:3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Redis（追加）
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # スキーマ作成を行うコンテナ
  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # 初期データを投入するコンテナ
  seed:
    build:
      context: .
      dockerfile: docker/seed/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
  redis_data: